<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.75; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -40; }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
    .card-float-1 { animation: floatCard1 6s ease-in-out infinite; }
    .card-float-2 { animation: floatCard2 7s ease-in-out infinite; }
    .stream-line { stroke-dasharray: 6 6; animation: dashStream 2s linear infinite; }
    .blinking-dot { animation: blinkDot 2s ease-in-out infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .body-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />

  <!-- Animated Glowing Ambient Lights (Strictly in Background) -->
  <g opacity="0.5">
    <circle class="orb-1" cx="220" cy="120" r="160" fill="#6366f1" filter="url(#glow-purple)" />
    <circle class="orb-2" cx="1020" cy="300" r="150" fill="#ec4899" filter="url(#glow-purple)" />
    <circle cx="650" cy="80" r="110" fill="#06b6d4" filter="url(#glow-cyan)" opacity="0.3" />
  </g>

  <!-- Overlay Tech Grid -->
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Dynamic Network Connection Streams -->
  <path class="stream-line" d="M 80 340 Q 300 280 500 350 T 950 330 T 1150 260" fill="none" stroke="#6366f1" stroke-width="1.8" opacity="0.4" />
  <path class="stream-line" d="M 120 70 Q 400 130 750 60 T 1120 110" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.35" />

  <!-- Animated Interactive Pills (Floating in lower right / top margins) -->
  <g class="card-float-1">
    <!-- Agentic Workflow Pill -->
    <rect x="880" y="55" width="260" height="48" rx="24" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="905" cy="79" r="6" fill="#38bdf8" class="blinking-dot" />
    <text class="body-text" x="922" y="84" fill="#e0f2fe" font-size="13" font-weight="600">⚡ Autonomous Resolution: 92%</text>
  </g>

  <g class="card-float-2">
    <!-- RAG-Grounded Pill -->
    <rect x="860" y="325" width="280" height="48" rx="24" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="885" cy="349" r="6" fill="#a855f7" class="blinking-dot" />
    <text class="body-text" x="902" y="354" fill="#f3e8ff" font-size="13" font-weight="600">🛡️ Zero-Hallucination RAG Stack</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Badges (Crisp, High Contrast, Guaranteed Foreground) -->
  <!-- Top Category Tag -->
  <g transform="translate(90, 80)">
    <rect width="215" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text class="body-text" x="16" y="21" fill="#c7d2fe" font-size="12" font-weight="700" letter-spacing="1.2">🤖 CURATED ECOSYSTEM</text>
  </g>

  <!-- Main Hero Title -->
  <text class="title-text" x="90" y="165" font-size="44" fill="#ffffff" letter-spacing="-0.5">
    Awesome Generative AI <tspan fill="url(#primary-grad)">Customer Service</tspan>
  </text>

  <!-- Hero Subtitle & Description -->
  <text class="body-text" x="90" y="212" font-size="18" fill="#94a3b8" font-weight="400">
    Enterprise SaaS Platforms • Autonomous AI Agents • Self-Hosted Open-Source Support Engines
  </text>

  <!-- Feature Feature Chips Row -->
  <g transform="translate(90, 255)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text class="body-text" x="14" y="22" fill="#cbd5e1" font-size="13">💬 Multi-Channel AI</text>

    <!-- Chip 2 -->
    <rect x="162" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text class="body-text" x="14" y="22" fill="#cbd5e1" font-size="13">⚙️ Agentic Tool-Use</text>

    <!-- Chip 3 -->
    <rect x="339" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text class="body-text" x="14" y="22" fill="#cbd5e1" font-size="13">🔒 PII &amp; Guardrails</text>

    <!-- Chip 4 -->
    <rect x="511" y="0" width="170" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text class="body-text" x="14" y="22" fill="#cbd5e1" font-size="13">🚀 Human-In-The-Loop</text>
  </g>

  <!-- Subtle Bottom Border Highlight -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primary-grad)" />
</svg>
